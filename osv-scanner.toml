[[IgnoredVulns]]
id = "CVE-2026-8763"
ignoreUntil = 2026-10-10
reason = "org.bouncycastle:bcprov-jdk18on cannot be upgraded to 1.85+ in this repo: it removes Kyber support and the ML-KEM replacement is incompatible with gematik's VAU handshake (de.gematik.vau / BouncyCastlePQCProvider). Escalated to Gematik; reviewed and accepted per Thomas Richner."

