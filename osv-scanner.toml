[[IgnoredVulns]]
id = "CVE-2026-47672"
ignoreUntil = 2026-12-05
reason = "Accepted risk: epa4all-rest-service deliberately has no authentication or authorization (see its README CAUTION), so any caller that can reach it can write documents using the configured SMC-B card. No fixed version exists. Mitigation: it only runs as a sidecar in the epa-exporter pod (helm epaInstances, ports 8081/8082), the Kubernetes Service exposes only the exporter port 8080, so the adapter is reachable only from inside the cluster via the pod IP. The README production example now binds the port to 127.0.0.1. Review before the ignore expires: confirm with a NetworkPolicy or by adding authentication that only the exporter can reach the sidecar."

