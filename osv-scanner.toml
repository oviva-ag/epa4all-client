id = "CVE-2026-12802"
ignoreUntil = 2026-12-05
reason = "org.bouncycastle:bcpkix-jdk18on 1.84 cannot be upgraded in this repo: bcpkix/bcutil 1.85+ pull in bcprov 1.85+, which fails at runtime (no such algorithm: KYBER, Kyber was removed from the BouncyCastle PQC provider) and 1.86 no longer compiles. Mixing newer bcpkix/bcutil with bcprov 1.84 was tested and breaks (NoClassDefFoundError: org/bouncycastle/asn1/iana/IANAObjectIdentifiers). gematik's VAU handshake (de.gematik.vau) still requires Kyber768, so a protocol migration agreed with Gematik is needed first. Same finding as AIKIDO-2026-231096."

